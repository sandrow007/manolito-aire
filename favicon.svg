<svg viewBox="0 0 600 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" />
    </filter>

    <linearGradient id="g9"  gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="30"><stop offset="0" stop-color="#00f3ff" stop-opacity="0.9"/><stop offset="1" stop-color="#00f3ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="g12" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="30"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.9"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient>
    <linearGradient id="g15" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="30"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
    <linearGradient id="g18" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="30"><stop offset="0" stop-color="#f472b6" stop-opacity="0.9"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>

    <g id="escudo"><path d="M 100,30 C 30,110 30,210 100,290 C 170,210 170,110 100,30 Z"/></g>
    <g id="wire" fill="none">
      <circle cx="100" cy="150" r="45"/>
      <path d="M 60,165 Q 80,155 100,165 T 140,165"/>
      <path d="M 65,175 Q 82.5,167 100,175 T 135,175"/>
      <path d="M 100,146 C 75,121 75,171 100,146 C 125,121 125,171 100,146 Z" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 100,30 C 30,110 30,210 100,290 C 170,210 170,110 100,30 Z" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Fondo negro, sin sol -->
  <rect width="100%" height="100%" fill="#020406"/>

  <!-- Suelo / anclaje -->
  <ellipse cx="300" cy="420" rx="60" ry="15" fill="#00f3ff" opacity="0.1" filter="url(#glow)"/>

  <!-- Las 4 sombras, de la mas larga a la mas corta -->
  <g transform="matrix(1 0 -0.9615 -0.1154 300 420) translate(-100,-290)" filter="url(#soft)" opacity="0.9">
    <use href="#escudo" fill="url(#g18)"/><use href="#wire" stroke="url(#g18)" stroke-width="8"/>
  </g>
  <g transform="matrix(1 0 0.808 -0.1731 300 420) translate(-100,-290)" filter="url(#soft)" opacity="0.9">
    <use href="#escudo" fill="url(#g9)"/><use href="#wire" stroke="url(#g9)" stroke-width="8"/>
  </g>
  <g transform="matrix(1 0 -0.5385 -0.2692 300 420) translate(-100,-290)" filter="url(#soft)" opacity="0.9">
    <use href="#escudo" fill="url(#g15)"/><use href="#wire" stroke="url(#g15)" stroke-width="8"/>
  </g>
  <g transform="matrix(1 0 0 -0.2115 300 420) translate(-100,-290)" filter="url(#soft)" opacity="0.9">
    <use href="#escudo" fill="url(#g12)"/><use href="#wire" stroke="url(#g12)" stroke-width="8"/>
  </g>

  <!-- Nucleos nitidos de cada sombra -->
  <g fill="none" stroke-width="1.8" opacity="0.75">
    <use href="#wire" stroke="#f472b6" transform="matrix(1 0 -0.9615 -0.1154 300 420) translate(-100,-290)"/>
    <use href="#wire" stroke="#00f3ff" transform="matrix(1 0 0.808 -0.1731 300 420) translate(-100,-290)"/>
    <use href="#wire" stroke="#a78bfa" transform="matrix(1 0 -0.5385 -0.2692 300 420) translate(-100,-290)"/>
    <use href="#wire" stroke="#3b82f6" transform="matrix(1 0 0 -0.2115 300 420) translate(-100,-290)"/>
  </g>

  <!-- Logo principal, sin sol -->
  <g transform="translate(200,130)" filter="url(#glow)">
    <path d="M 100,30 C 30,110 30,210 100,290 C 170,210 170,110 100,30 Z" fill="rgba(255,42,75,0.05)" stroke="#ff2a4b" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="100" cy="150" r="45" fill="none" stroke="#ffcc00" stroke-width="3"/>
    <path d="M 100,146 C 75,121 75,171 100,146 C 125,121 125,171 100,146 Z" fill="none" stroke="#ff2a4b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60,165 Q 80,155 100,165 T 140,165" fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 65,175 Q 82.5,167 100,175 T 135,175" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
