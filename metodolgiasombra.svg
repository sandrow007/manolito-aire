<svg width="100%" viewBox="0 0 690 550" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Diagrama de radiación solar directa, difusa y reflejada con aerosoles y sombra</title>
  <desc>Muestra cómo las partículas contaminantes dispersan radiación dentro de zonas en sombra geométrica, reduciendo la calidad de la sombra incluso sin sol directo.</desc>

  <defs>
    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8E8F8"/>
      <stop offset="100%" stop-color="#EAF5FE"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2B28A"/>
      <stop offset="100%" stop-color="#A89060"/>
    </linearGradient>
    <linearGradient id="shadow-zone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8BAEC8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8BAEC8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="building-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A9BAD"/>
      <stop offset="100%" stop-color="#C4CDD6"/>
    </linearGradient>
    <linearGradient id="aerosol-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A050" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C89040" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8C0"/>
      <stop offset="70%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#E8A020"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="680" height="420" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="420" width="680" height="130" fill="url(#ground)"/>

  <!-- Aerosol layer -->
  <rect x="0" y="92" width="680" height="78" fill="url(#aerosol-g)" opacity="0.35"/>
  <g opacity="0.6">
    <!-- Particles -->
    <circle cx="90" cy="110" r="3.5" fill="#B06A20"/>
    <circle cx="140" cy="132" r="2.5" fill="#B06A20"/>
    <circle cx="195" cy="104" r="3" fill="#B06A20"/>
    <circle cx="250" cy="127" r="4" fill="#B06A20"/>
    <circle cx="420" cy="107" r="3" fill="#B06A20"/>
    <circle cx="475" cy="132" r="4" fill="#B06A20"/>
    <circle cx="525" cy="102" r="2.5" fill="#B06A20"/>
    <circle cx="580" cy="124" r="3" fill="#B06A20"/>
    <circle cx="620" cy="110" r="3.5" fill="#B06A20"/>
    <circle cx="115" cy="157" r="2" fill="#B06A20"/>
    <circle cx="220" cy="164" r="3" fill="#B06A20"/>
    <circle cx="440" cy="160" r="3" fill="#B06A20"/>
    <circle cx="555" cy="147" r="2" fill="#B06A20"/>
    <circle cx="60" cy="140" r="2.5" fill="#B06A20" opacity="0.5"/>
    <circle cx="170" cy="145" r="3" fill="#B06A20" opacity="0.6"/>
    <circle cx="380" cy="120" r="2" fill="#B06A20" opacity="0.7"/>
    <circle cx="500" cy="140" r="3.5" fill="#B06A20" opacity="0.5"/>
    <circle cx="600" cy="150" r="2.5" fill="#B06A20" opacity="0.6"/>
  </g>

  <!-- Aerosol label (MOVED TO THE RIGHT TO AVOID THE SUN RAY) -->
  <rect x="420" y="140" width="224" height="26" rx="6" fill="#8A5A20" opacity="0.9"/>
  <text x="430" y="157" fill="#FFF3DD" font-size="12" font-family="system-ui, sans-serif">capa de aerosoles · PM2.5 · calima</text>

  <!-- Geometric shadow zone -->
  <polygon points="300,180 680,310 680,420 300,420" fill="url(#shadow-zone)"/>
  <g stroke="#5A7A9A" stroke-width="0.4" opacity="0.2">
    <line x1="320" y1="420" x2="680" y2="310"/>
    <line x1="390" y1="420" x2="680" y2="345"/>
    <line x1="460" y1="420" x2="680" y2="375"/>
    <line x1="530" y1="420" x2="680" y2="405"/>
  </g>

  <!-- Building -->
  <g filter="url(#drop-shadow)">
    <rect x="250" y="180" width="90" height="240" fill="url(#building-g)"/>
    <rect x="250" y="175" width="90" height="12" rx="2" fill="#7A8FA0"/>
    <!-- Windows -->
    <rect x="262" y="200" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.8"/>
    <rect x="300" y="200" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.8"/>
    <rect x="262" y="245" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.6"/>
    <rect x="300" y="245" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.6"/>
    <rect x="262" y="290" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.5"/>
    <rect x="300" y="290" width="18" height="22" rx="2" fill="#D8E8F4" opacity="0.5"/>
    <!-- Door -->
    <rect x="280" y="380" width="30" height="40" rx="3" fill="#6A5A3A" opacity="0.7"/>
  </g>
  <!-- Building label -->
  <rect x="258" y="440" width="76" height="20" rx="4" fill="#5A4A30" opacity="0.9"/>
  <text x="296" y="454" text-anchor="middle" fill="#FFEEDD" font-size="12" font-family="system-ui, sans-serif">edificio</text>

  <!-- Sun -->
  <circle cx="80" cy="58" r="26" fill="url(#sun-grad)" opacity="0.95"/>
  <g stroke="#F5C842" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="80" y1="22" x2="80" y2="14"/>
    <line x1="104" y1="34" x2="110" y2="28"/>
    <line x1="116" y1="58" x2="124" y2="58"/>
    <line x1="104" y1="82" x2="110" y2="88"/>
    <line x1="56" y1="34" x2="50" y2="28"/>
    <line x1="44" y1="58" x2="36" y2="58"/>
  </g>

  <!-- Direct radiation arrow -->
  <line x1="96" y1="74" x2="250" y2="232" stroke="#E8A020" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- Direct label -->
  <text x="134" y="166" fill="#8A5A10" text-anchor="middle" transform="rotate(33,134,161)" font-size="12" font-weight="bold" stroke="#FFF3DD" stroke-width="3" paint-order="stroke" font-family="system-ui, sans-serif">directo</text>

  <!-- Aerosol scattering point -->
  <circle cx="310" cy="128" r="7" fill="#B06A20" opacity="0.95"/>
  <line x1="96" y1="74" x2="304" y2="124" stroke="#E8A020" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Scattering arrows -->
  <line x1="310" y1="121" x2="338" y2="68" stroke="#E8A020" stroke-width="1.2" opacity="0.5" marker-end="url(#arrow-s)"/>
  <line x1="317" y1="128" x2="400" y2="130" stroke="#E8A020" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow-s)"/>
  <line x1="303" y1="128" x2="210" y2="132" stroke="#E8A020" stroke-width="1.2" opacity="0.45" marker-end="url(#arrow-s)"/>

  <!-- Diffuse radiation reaching shadow -->
  <line x1="314" y1="134" x2="530" y2="345" stroke="#E8A020" stroke-width="2" opacity="0.8" stroke-dasharray="6 3" marker-end="url(#arrow-s)"/>
  <line x1="314" y1="134" x2="570" y2="380" stroke="#E8A020" stroke-width="1.6" opacity="0.65" stroke-dasharray="6 3" marker-end="url(#arrow-s)"/>

  <!-- Scattering label -->
  <rect x="346" y="86" width="132" height="42" rx="6" fill="#8A5A20" opacity="0.9"/>
  <text x="412" y="103" text-anchor="middle" fill="#FFF3DD" font-size="12" font-family="system-ui, sans-serif">dispersión</text>
  <text x="412" y="118" text-anchor="middle" fill="#FFF3DD" font-size="12" font-family="system-ui, sans-serif">por aerosoles</text>
  <line x1="346" y1="107" x2="318" y2="123" stroke="#8A5A20" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Reflected radiation from ground (separated from building) -->
  <line x1="460" y1="420" x2="535" y2="370" stroke="#4A6A80" stroke-width="1.8" opacity="0.8" stroke-dasharray="5 3" marker-end="url(#arrow-s)"/>
  <rect x="430" y="432" width="104" height="38" rx="6" fill="#2A4A60" opacity="0.9"/>
  <text x="482" y="448" text-anchor="middle" fill="#D8ECFA" font-size="12" font-family="system-ui, sans-serif">reflejada</text>
  <text x="482" y="462" text-anchor="middle" fill="#D8ECFA" font-size="12" font-family="system-ui, sans-serif">desde el suelo</text>

  <!-- Person in geometric shadow (grounded and near tree) -->
  <g filter="url(#drop-shadow)">
    <circle cx="550" cy="355" r="13" fill="#2A5A8A"/>
    <rect x="538" y="369" width="24" height="30" rx="5" fill="#2A5A8A"/>
    <line x1="538" y1="377" x2="522" y2="395" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round"/>
    <line x1="562" y1="377" x2="576" y2="395" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round"/>
    <line x1="544" y1="399" x2="540" y2="420" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round"/>
    <line x1="556" y1="399" x2="560" y2="420" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Arrow showing diffuse radiation reaching the person -->
  <line x1="538" y1="360" x2="515" y2="340" stroke="#E8A020" stroke-width="1.8" opacity="0.85" marker-end="url(#arrow-s)"/>

  <!-- Person in direct sun -->
  <g filter="url(#drop-shadow)">
    <circle cx="150" cy="378" r="13" fill="#2A5A8A" opacity="0.7"/>
    <rect x="138" y="392" width="24" height="28" rx="5" fill="#2A5A8A" opacity="0.7"/>
    <line x1="138" y1="398" x2="122" y2="416" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="162" y1="398" x2="176" y2="416" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="144" y1="420" x2="140" y2="440" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <line x1="156" y1="420" x2="160" y2="440" stroke="#2A5A8A" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <rect x="118" y="450" width="64" height="20" rx="4" fill="#2A5A8A" opacity="0.6"/>
  <text x="150" y="464" text-anchor="middle" fill="#F0F6FA" font-size="12" font-family="system-ui, sans-serif">al sol</text>

  <!-- TREE 1 (Main tree right) -->
  <g filter="url(#drop-shadow)">
    <rect x="600" y="350" width="8" height="70" rx="2" fill="#8A7050"/>
    <circle cx="604" cy="338" r="30" fill="#4A8A3A" opacity="0.85"/>
    <circle cx="582" cy="348" r="20" fill="#3A7A2A" opacity="0.75"/>
    <circle cx="626" cy="345" r="22" fill="#5A9A45" opacity="0.75"/>
  </g>

  <!-- TREE 2 (Left tree) -->
  <g filter="url(#drop-shadow)">
    <rect x="40" y="350" width="8" height="50" rx="2" fill="#8A7050"/>
    <circle cx="44" cy="335" r="25" fill="#4A8A3A" opacity="0.85"/>
    <circle cx="25" cy="345" r="18" fill="#3A7A2A" opacity="0.75"/>
    <circle cx="63" cy="342" r="20" fill="#5A9A45" opacity="0.75"/>
  </g>

  <!-- TREE 3 (Far right tree) -->
  <g filter="url(#drop-shadow)">
    <rect x="660" y="360" width="8" height="60" rx="2" fill="#8A7050"/>
    <circle cx="664" cy="345" r="22" fill="#4A8A3A" opacity="0.85"/>
    <circle cx="648" cy="355" r="16" fill="#3A7A2A" opacity="0.75"/>
    <circle cx="680" cy="352" r="18" fill="#5A9A45" opacity="0.75"/>
  </g>

  <!-- TREE 4 (Small bush near building) -->
  <g filter="url(#drop-shadow)">
    <rect x="220" y="400" width="6" height="20" rx="1" fill="#8A7050"/>
    <circle cx="223" cy="390" r="14" fill="#4A8A3A" opacity="0.85"/>
    <circle cx="212" cy="396" r="10" fill="#3A7A2A" opacity="0.75"/>
    <circle cx="234" cy="394" r="11" fill="#5A9A45" opacity="0.75"/>
  </g>

  <!-- Shadow quality note -->
  <rect x="410" y="240" width="195" height="58" rx="8" fill="#15324E" opacity="0.95"/>
  <text x="507.5" y="264" text-anchor="middle" fill="#F3F8FC" font-size="14" font-weight="500" font-family="system-ui, sans-serif">sombra geométrica: sí</text>
  <text x="507.5" y="282" text-anchor="middle" fill="#B8D8F4" font-size="12" font-family="system-ui, sans-serif">radiación difusa: llega igual</text>
  <text x="507.5" y="295" text-anchor="middle" fill="#FAC775" font-size="12" font-family="system-ui, sans-serif">calidad de sombra: baja</text>

  <!-- Personalised explanation box -->
  <rect x="8" y="476" width="430" height="80" rx="6" fill="#1E1E1C" fill-opacity="0.08"/>
  <line x1="20" y1="492" x2="52" y2="492" stroke="#E8A020" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-s)"/>
  <text x="58" y="496" fill="#6A4A10" font-size="12" font-family="system-ui, sans-serif">Radiación directa + dispersión por aerosoles</text>
  <line x1="20" y1="514" x2="52" y2="514" stroke="#E8A020" stroke-width="2" stroke-dasharray="6 3" stroke-linecap="round" marker-end="url(#arrow-s)"/>
  <text x="58" y="518" fill="#6A4A10" font-size="12" font-family="system-ui, sans-serif">Difusa que penetra en la sombra</text>
  <text x="20" y="540" fill="#6A4A10" font-size="12" font-style="italic" font-family="system-ui, sans-serif">La calima hace que la sombra no sea tan fresca ni oscura.</text>
</svg>